# House Electricals — dev database only. Backed by `pnpm dev` (backend runs on
# the host via tsx) and the backend/e2e test suites. Host port 5433 avoids
# clashing with a system Postgres on 5432.
#   Up:    docker compose -f docker-compose.dev.yml up -d
#   Reset: docker compose -f docker-compose.dev.yml down -v

services:
  db:
    image: postgres:18-alpine
    container_name: he-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: house_electricals
    ports:
      - "5433:5432"
    volumes:
      # Mount the parent dir, not /var/lib/postgresql/data — Postgres 18+ stores
      # its cluster in a version-specific subdir and refuses to start otherwise.
      - he-pgdata-dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d house_electricals"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  he-pgdata-dev:

# House Electricals — production stack. Pulls the prebuilt image from GHCR
# (published by .github/workflows/release.yml) and runs it next to Postgres.
# Full guide: DEPLOYMENT.md. Configure via .env (see .env.example).

services:
  db:
    image: postgres:18-alpine
    container_name: house-electricals-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Postgres is only reachable on the internal compose network (no host
      # port), so this default is safe to start with — set a strong value in
      # .env for anything beyond a quick local try.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-house_electricals}
    volumes:
      # Mount the PARENT dir, not .../data — Postgres 18 keeps its cluster in a
      # versioned subdir and won't start if a volume sits at the old path.
      - he-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-house_electricals}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # Defaults to the official published image so `docker compose up` just works.
    # :latest = newest stable release; use :nightly for the newest build off
    # main, or pin :vX.Y.Z / :sha-<full> for a frozen rollback. Override via .env.
    image: ${IMAGE:-ghcr.io/antoinebriseboisroy/house-electricals:latest}
    container_name: house-electricals
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Floor-plan images + the auto-generated .auth-secret (relational data is in Postgres).
      - ${DATA_PATH:-./data}:/data
    environment:
      # Built from the POSTGRES_* parts above (the only env var the image
      # doesn't already default — NODE_ENV/PORT/HOST/FLOOR_PLAN_DIR/PUBLIC_DIR
      # are all baked into the Dockerfile).
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-house_electricals}
      # Optional app-wide display timezone (IANA name). Empty = each device's local time.
      TZ: ${TZ:-}
    ports:
      # Point your reverse proxy (Caddy / Cloudflare Tunnel / Nginx) at this host port.
      - "${HOST_PORT:-8070}:3000"
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  he-pgdata:
